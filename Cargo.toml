[package]
name = "checklister"
version = "0.1.0"
edition = "2024"
default-run = "checklister"

[dependencies]
clap = { version = "4", features = ["derive"] }
rmcp = { version = "3.11", default-features = false, features = [
    "macros",
    "server",
    "transport-io",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
tempfile = "3"
